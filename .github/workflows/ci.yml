name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: furni_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Миграции и RLS
        run: |
          pnpm --filter api prisma migrate deploy
          psql "$DATABASE_URL" -f apps/api/prisma/migrations/0001_init/rls.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/furni_test
      - run: pnpm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/furni_test

  perf-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Бюджет размера бандлов
        run: pnpm size-limit
      - run: pnpm exec playwright install --with-deps chromium
      - name: Перф-гейт сцены
        run: pnpm test:perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-report
          path: tests/perf/results/
