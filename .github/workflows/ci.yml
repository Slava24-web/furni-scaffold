name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: furni_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Prisma Client
        # Клиент не генерируется на postinstall: схема лежит не в дефолтном
        # месте. Без него не проходит проверка типов в apps/api
        run: pnpm --filter api prisma generate
        env:
          DATABASE_URL: postgresql://furni_app:furni_app@localhost:5432/furni_test
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/furni_test
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Миграции, роль приложения и RLS
        run: |
          pnpm --filter api prisma migrate deploy
          pnpm db:rls
        env:
          DATABASE_URL: postgresql://furni_app:furni_app@localhost:5432/furni_test
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/furni_test
      - run: pnpm test
        env:
          # Тесты ходят в БД под ролью приложения: под суперпользователем
          # политики RLS не применяются и тест изоляции ничего не проверяет
          DATABASE_URL: postgresql://furni_app:furni_app@localhost:5432/furni_test
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/furni_test

  perf-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Демо-модели тенанта test
        # Модели генерируются, а не лежат в репозитории: так пайплайн
        # проверяется на каждом прогоне, а бинарники не пухнут в истории
        run: pnpm models:test
      - run: pnpm build
      - name: Бюджет размера бандлов
        run: pnpm size-limit
      - run: pnpm exec playwright install --with-deps chromium
      - name: Перф-гейт сцены
        run: pnpm test:perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-report
          path: tests/perf/results/
